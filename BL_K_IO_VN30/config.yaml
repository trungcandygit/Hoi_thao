# ============================================================
# BL-K_IO VN30 — Master Configuration
# ============================================================

data:
  start_date: "2014-06-01"
  end_date:   "2025-12-31"   # sẽ bị cắt tại tháng cuối có dữ liệu thực
  freq: "ME"                  # month-end resampling (pandas alias)

  # Đường dẫn thư mục (tương đối so với project root)
  raw_dir:       "data/raw"
  processed_dir: "data/processed"

  # File thành phần VN30 (bạn cấp nếu muốn tránh survivorship bias)
  constituents_file: "data/raw/vn30_constituents.csv"   # cột: effective_date, ticker
  risk_free_file:    "data/raw/risk_free.csv"            # cột: year, rate  (lãi suất năm)

  # Nếu file này tồn tại, DataLoader đọc trực tiếp thay vì gọi vnstock
  # Schema mong đợi: date (YYYY-MM-DD), ticker, close (adjusted), market_cap
  prices_file:    "data/raw/prices.csv"
  marketcap_file: "data/raw/market_cap.csv"

  # Danh sách VN30 fallback (dùng khi KHÔNG có constituents_file)
  # — CHỈ phản ánh rổ hiện tại; có thể gây survivorship bias —
  vn30_current:
    - ACB
    - BCM
    - BID
    - BVH
    - CTG
    - FPT
    - GAS
    - GVR
    - HDB
    - HPG
    - MBB
    - MSN
    - MWG
    - NVL
    - PDR
    - PLX
    - POW
    - SAB
    - SHB
    - SSB
    - SSI
    - STB
    - TCB
    - TPB
    - VCB
    - VHM
    - VIB
    - VIC
    - VJC
    - VNM
    - VPB
    - VRE
    - VHM

model:
  estimation_window: 36      # tháng (ESTIMATION_WINDOW)
  tau: null                   # null → tự tính 1/estimation_window
  delta: 2.5                  # risk-aversion coefficient
  n_clusters_range: [2, 6]    # quét k = 2..6
  omega_type: "diag"          # "diag" hoặc "full"

  # Tối ưu
  max_weight: 0.30            # MAX_WEIGHT
  min_weight: 0.00            # no short
  solver: "SLSQP"

  # Transaction cost
  tc_bps: 15                  # basis points mỗi lượt (1 bps = 0.01%)

# Giai đoạn con để phân tích hiệu suất (bull / disrupted)
sub_periods:
  bull:
    start: "2014-06-01"
    end:   "2019-12-31"
  disrupted:
    start: "2020-01-01"
    end:   "2025-12-31"

robustness:
  estimation_windows: [24, 36, 48]
  max_weights:        [0.20, 0.30, 0.40]
  k_values:           [2, 3, 4, 5, 6]
  mc_perturbations:   [0.05, 0.10]   # ±5%, ±10%
  mc_scenarios:       2000

random_seed: 42
log_level: "INFO"
